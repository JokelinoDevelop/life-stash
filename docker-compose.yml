# Local services for `pnpm dev`. Start with `pnpm storage:up`, then run
# `pnpm storage:setup` once to create the bucket and dev key.
services:
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    ports:
      # Loopback only: the dev keys in this repo are public, so never expose Garage to the network.
      - "127.0.0.1:3900:3900"
    volumes:
      - ./dev/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

volumes:
  garage-meta:
  garage-data:
